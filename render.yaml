# Free Render setup for the Django API and best-effort Celery tasks.
# Neon and the existing Render Key Value instance are configured in Render;
# this Blueprint doesn't create either datastore.
services:
  - type: web
    name: rafiki-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m pip install -r requirements.txt && USE_S3=false DJANGO_COLLECTSTATIC_BUILD=true python manage.py collectstatic --noinput
    # Free services don't support pre-deploy commands or standalone workers.
    # Migrations and Celery run alongside Gunicorn in this single web instance.
    startCommand: >-
      sh -c 'DATABASE_URL_POOLED="$DATABASE_URL" python manage.py migrate --noinput &&
      (celery -A config worker --beat --loglevel=info --concurrency=1 &
      exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -)'
    healthCheckPath: /api/v1/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: rafiki-api.onrender.com,api.rafikicarhire.com
      - key: DATABASE_URL
        sync: false # Neon direct URL; used by migrations
      - key: DATABASE_URL_POOLED
        sync: false # Neon pooled URL; Django application traffic
      - key: REDIS_URL
        sync: false # Paste the connection URL for the existing free Key Value instance.
      - key: FRONTEND_URL
        value: https://www.rafikicarhire.com
      - key: BACKEND_URL
        value: https://api.rafikicarhire.com
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: Rafiki Car Hire <bookings@rafikicarhire.com>
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: PAYMENT_GATEWAYS_ENABLED
        value: pesapal
      - key: PESAPAL_ENV
        sync: false # Choose sandbox or live to match the credentials provided.
      - key: PESAPAL_CONSUMER_KEY
        sync: false
      - key: PESAPAL_CONSUMER_SECRET
        sync: false
      - key: PESAPAL_IPN_ID
        sync: false
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://www.rafikicarhire.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://www.rafikicarhire.com
      - key: USE_S3
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false # Cloudflare R2 endpoint, per backend/.env.example
      - key: AWS_S3_REGION_NAME
        sync: false # Use auto for R2 or the AWS region for Amazon S3.
      - key: AWS_PUBLIC_BUCKET_NAME
        value: rafiki-public
      - key: AWS_PRIVATE_BUCKET_NAME
        value: rafiki-private
