# Free Render setup for hobby/testing deployments.
# The web service runs Gunicorn plus a single Celery worker/beat process.
# Free services can sleep or restart, so scheduled/background work is best effort.
databases:
  - name: rafiki-db
    plan: free
    databaseName: rafiki
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: rafiki-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: rafiki-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free services do not support one-off pre-deploy jobs, so migrate at startup.
    # The Redis-backed Celery worker/beat shares this free web instance.
    startCommand: >-
      sh -c 'python manage.py migrate --noinput &&
      (celery -A config worker -B --loglevel=info --concurrency=1 &
      exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -)'
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase: { name: rafiki-db, property: connectionString }
      - key: REDIS_URL
        fromService: { type: keyvalue, name: rafiki-redis, property: connectionString }
